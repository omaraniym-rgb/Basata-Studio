<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Page not found — Basata Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.png" sizes="512x512">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#f7f6f2;--fg:#111110;--line:rgba(17,17,16,.14);--orange:#ff6600}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--fg:#eceae6;--line:#2c2b29}}
html,body{height:100%;margin:0}
body{background:var(--bg);display:grid;place-items:center;padding:24px;box-sizing:border-box;overflow:hidden;-webkit-user-select:none;user-select:none}
svg{width:min(620px,92vw);max-height:80vh;height:auto;overflow:visible;touch-action:none}
#stroke{fill:var(--fg)}
#floor{stroke:var(--line);stroke-width:5}
#ghost{fill:none;stroke:var(--line);stroke-width:5;stroke-dasharray:14 18;opacity:0;transition:opacity .6s}
#ghost.on{opacity:1}
#dot{fill:var(--orange);transform-box:fill-box;transform-origin:center;cursor:grab;stroke:transparent;stroke-width:140;outline:none}
#dot:active{cursor:grabbing}
#dot:focus-visible{stroke:var(--line);stroke-width:12}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<h1 class="sr">Page not found</h1>
<svg id="art" viewBox="-760 -240 1740 1160" aria-label="The Basata mark has lost its dot. Drag the dot back to go home.">
  <line id="floor" x1="-740" y1="907" x2="960" y2="907"/>
  <circle id="ghost" cx="766" cy="536" r="172"/>
  <path id="stroke" d="M 795.960938 -142.128906 C 802.238281 -149.769531 813.152344 -151.710938 821.660156 -146.671875 C 863.515625 -121.875 891.816406 -97.335938 908.902344 -67.871094 C 927.984375 -34.980469 948.792969 8.160156 934.457031 58.78125 C 917.667969 118.046875 895.757812 151.550781 828.886719 204.179688 C 799.183594 227.554688 533.277344 416.101562 216.378906 466.398438 C 150.386719 476.875 86.445312 482.300781 17.878906 470.144531 C 8.285156 467.59375 0.628906 461.394531 -3.988281 453.433594 C -8.605469 445.472656 -10.191406 435.746094 -7.640625 426.148438 C -5.089844 416.550781 0.523438 407.675781 9.078125 404.28125 C 46.238281 389.519531 301.90625 291.628906 442.90625 184.699219 C 649.269531 28.199219 762.621094 -101.53125 795.960938 -142.128906"/>
  <path id="dot" tabindex="0" role="button" aria-label="Put the dot back and go home" d="M 598.375 491.589844 C 622.964844 399.085938 717.886719 344.027344 810.390625 368.617188 C 902.894531 393.207031 957.949219 488.128906 933.363281 580.632812 C 908.773438 673.136719 813.851562 728.191406 721.347656 703.601562 C 628.84375 679.015625 573.785156 584.09375 598.375 491.589844"/>
</svg>
<a class="sr" href="/">Go to the Basata Studio home page</a>
<script>
(function(){
  var svg=document.getElementById('art'),dot=document.getElementById('dot'),ghost=document.getElementById('ghost');
  var R=172, FLOOR=197, MINX=-1350, MAXX=40;         // offsets from the dot's home, in drawing units
  var CLOSE=R*1.15;                                   // home, or within 15% around it, counts
  var still=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var s={x:0,y:0,r:0}, anim=null, done=false;
  var tf=function(o){return 'translate('+o.x+'px,'+o.y+'px) rotate('+o.r+'deg)'};
  var set=function(o){s={x:o.x,y:o.y,r:o.r};dot.style.transform=tf(s)};
  var play=function(frames,opt,end){
    if(anim)anim.cancel();
    var last=frames[frames.length-1];
    if(still||!dot.animate){set(last);end&&end();return}
    anim=dot.animate(frames.map(function(f){return {transform:tf(f),offset:f.o}}),opt);
    anim.onfinish=function(){set(last);anim=null;end&&end()};
  };

  // 1. the mark is whole, then the dot falls off and rolls away
  play([{x:0,y:0,r:0,o:0},{x:-6,y:-18,r:-4,o:.12},{x:-300,y:FLOOR,r:-60,o:.45},{x:-600,y:80,r:-200,o:.58},
        {x:-860,y:FLOOR,r:-560,o:.72},{x:-1000,y:165,r:-660,o:.82},{x:-1300,y:FLOOR,r:-860,o:1}],
       {duration:1600,delay:900,easing:'cubic-bezier(.23,1,.32,1)'},function(){ghost.classList.add('on')});

  // 2. drag it back
  var pt=function(e){var p=svg.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(svg.getScreenCTM().inverse())};
  var grab=null;
  dot.addEventListener('pointerdown',function(e){
    if(done)return; e.preventDefault();
    if(anim){var m=new DOMMatrix(getComputedStyle(dot).transform);anim.cancel();anim=null;
      set({x:m.e,y:m.f,r:Math.atan2(m.b,m.a)*180/Math.PI})}
    ghost.classList.add('on');
    var p=pt(e); grab={dx:p.x-s.x,dy:p.y-s.y,lx:s.x};
    dot.setPointerCapture(e.pointerId);
  });
  dot.addEventListener('pointermove',function(e){
    if(!grab)return; var p=pt(e);
    var x=Math.max(MINX,Math.min(MAXX+300,p.x-grab.dx)), y=Math.max(-700,Math.min(FLOOR,p.y-grab.dy));
    set({x:x,y:y,r:s.r+(x-grab.lx)/R*57.3}); grab.lx=x;   // it rolls as it moves
  });
  var drop=function(){
    if(!grab)return; grab=null;
    if(Math.hypot(s.x,s.y)<=CLOSE)return home();
    // not close enough: it falls back to the floor
    var x=Math.max(MINX,Math.min(MAXX,s.x)), h=FLOOR-s.y;
    if(h<2&&x===s.x)return;
    play([{x:s.x,y:s.y,r:s.r,o:0},{x:x,y:FLOOR,r:s.r-40,o:.6},{x:x,y:FLOOR-Math.min(80,h*.2),r:s.r-55,o:.8},{x:x,y:FLOOR,r:s.r-60,o:1}],
         {duration:300+Math.sqrt(Math.max(h,1))*22,easing:'ease-in'});
  };
  dot.addEventListener('pointerup',drop); dot.addEventListener('pointercancel',drop);

  // 3. back in place: the mark is whole again, and so is the way home
  var home=function(){
    if(done)return; done=true;
    var r=Math.round(s.r/360)*360;
    play([{x:s.x,y:s.y,r:s.r,o:0},{x:0,y:0,r:r,o:1}],{duration:420,easing:'cubic-bezier(.34,1.56,.64,1)'},function(){
      ghost.classList.remove('on'); setTimeout(function(){location.href='/'},still?0:650);
    });
  };
  dot.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();home()}});
})();
</script>
</body>
</html>

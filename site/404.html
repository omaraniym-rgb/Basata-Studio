<head>
<meta charset="utf-8">

<title>Page not found — Basata Studio</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/favicon.png" sizes="512x512">
<meta name="theme-color" content="#f7f6f2" media="(prefers-color-scheme: light)"><meta name="theme-color" content="#121211" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{--bg:#f7f6f2;--fg:#111110;--fg-2:#6b6963;--line:rgba(17,17,16,.12);--orange:#ff6600;--sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;--ease:cubic-bezier(.23,1,.32,1)}
@media (prefers-color-scheme:dark){:root{--bg:#121211;--fg:#eceae6;--fg-2:#9a968f;--line:#2a2927}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:400 17px/1.5 var(--sans);display:grid;place-items:center;padding:24px;overflow:hidden}
main{width:100%;max-width:560px;display:grid;justify-items:center;text-align:center;gap:0}
.code{font:500 12px/1 var(--mono);letter-spacing:.14em;color:var(--fg-2);margin:0 0 20px}
svg{width:min(340px,78vw);height:auto;overflow:visible;margin-bottom:28px}
#stroke{fill:var(--fg)}
#floor{stroke:var(--line);stroke-width:6}
#dot{fill:var(--orange);transform-box:fill-box;transform-origin:center;cursor:pointer;
  animation:fall 1.5s var(--ease) .9s both}
@keyframes fall{
  0%{transform:translate(0,0) rotate(0)}
  12%{transform:translate(-6px,-18px) rotate(-4deg)}
  45%{transform:translate(-300px,197px) rotate(-60deg)}
  58%{transform:translate(-600px,80px) rotate(-200deg)}
  72%{transform:translate(-860px,197px) rotate(-560deg)}
  82%{transform:translate(-1000px,165px) rotate(-660deg)}
  100%{transform:translate(-1300px,197px) rotate(-860deg)}}
body.home #dot{animation:back .7s var(--ease) both}
@keyframes back{from{transform:translate(-1300px,197px) rotate(-860deg)}to{transform:translate(0,0) rotate(0)}}
h1{font-weight:500;font-size:clamp(28px,5.4vw,40px);line-height:1.12;letter-spacing:-.01em;margin:0 0 12px;text-wrap:balance}
p.sub{color:var(--fg-2);margin:0 0 32px;max-width:36ch;text-wrap:balance}
.put{font:500 15px/1 var(--sans);color:var(--bg);background:var(--fg);border:0;border-radius:999px;padding:16px 26px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;transition:transform .2s var(--ease)}
.put:hover{transform:translateY(-2px)}.put:active{transform:scale(.97)}
.put i{width:10px;height:10px;border-radius:50%;background:var(--orange)}
nav{margin-top:28px;display:flex;gap:24px;font:500 12px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase}
nav a{color:var(--fg-2);text-decoration:none;padding-bottom:3px;border-bottom:1px solid var(--line)}
nav a:hover{color:var(--fg);border-color:currentColor}
@media (prefers-reduced-motion:reduce){#dot{animation:none;transform:translate(-1300px,197px)}body.home #dot{animation:none;transform:none}}
</style>
</head>

<h1>This page lost its dot.</h1>
<p class="sub">Without its dot, our mark is just a line. Without the right address, this is just a page.</p>
<button class="put" type="button"><i></i>Put it back, take me home</button>
<nav><a href="/work/">Work</a><a href="/journal/">Journal</a></nav>
</main>
<script>
(function(){
  var go=function(){document.body.classList.add('home');setTimeout(function(){location.href='/'},matchMedia('(prefers-reduced-motion:reduce)').matches?0:750)};
  document.querySelector('.put').addEventListener('click',go);
  document.getElementById('dot').addEventListener('click',go);
})();
</script>

</html>
